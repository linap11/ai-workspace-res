version: "3.9"

services:

  # -----------------------
  # API SERVICE
  # -----------------------
  api:
    build:
      context: .
      dockerfile: ./infra/docker/Dockerfile

    container_name: ai-api

    ports:
      - "8000:8000"

    # reads .env.prod from host and injects variables into the CONTAINER environment
    env_file:
      - .env.prod

    depends_on:
      - postgres
      - redis
      - qdrant

    restart: unless-stopped

  # -----------------------
  # POSTGRES
  # -----------------------
  postgres:
    image: postgres:15
    container_name: ai-postgres
    env_file:
      - .env.prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # -----------------------
  # REDIS CACHE
  # -----------------------
  redis:
    image: redis:7-alpine
    container_name: ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # -----------------------
  # VECTOR DATABASE
  # -----------------------
  qdrant:
    image: qdrant/qdrant
    container_name: ai-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

# -----------------------
# PERSISTENT STORAGE
# -----------------------
volumes:
  pgdata:
  redisdata:
  qdrantdata:
